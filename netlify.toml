# ─── Netlify Configuration ──────────────────────────────────────────────────
# Documentación: https://docs.netlify.com/configure-builds/file-based-configuration/

[build]
  # Netlify corre este comando desde la raíz del repo
  command = "cd Backend && npm install --include=dev && npx prisma generate && npx prisma migrate deploy && cd .. && cd Frontend && npm install --include=dev && npm run build"
  # La carpeta que Netlify publica como sitio estático
  publish = "Frontend/dist"
  # Carpeta donde viven las Netlify Functions (el backend serverless)
  functions = "Backend/netlify/functions"

[build.environment]
  NODE_VERSION = "20"

# ─── Functions config ─────────────────────────────────────────────────────────
# zisi es el bundler predeterminado y más estable con pdfkit.
# included_files fuerza el empaquetado de los .afm (fuentes Helvetica, etc.)
# que pdfkit necesita en runtime serverless para renderizar el PDF.
[functions]
  node_bundler = "zisi"

[functions."api"]
  included_files = ["Backend/node_modules/pdfkit/js/data/**"]

# ─── Redirects ───────────────────────────────────────────────────────────────

# 1) /api/* → Netlify Function (backend Express serverless)
#    :splat captura todo lo que viene después de /api/
#    Ejemplo: /api/users → /.netlify/functions/api/users
[[redirects]]
  from   = "/api/*"
  to     = "/.netlify/functions/api/:splat"
  status = 200
  force  = true

# 2) SPA fallback — React Router maneja rutas del lado cliente
#    Sin esto, al refrescar /dashboard Netlify daría 404
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200
