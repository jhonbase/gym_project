# ─── Netlify Configuration ──────────────────────────────────────────────────
# Documentación: https://docs.netlify.com/configure-builds/file-based-configuration/

[build]
  # Build command:
  # 1. Backend: instala deps, genera Prisma client, aplica migraciones
  # 2. Copia fuentes .afm de pdfkit a netlify/functions/data/
  #    (pdfkit las busca en runtime relativo al archivo de la function)
  # 3. Frontend: instala deps (incluyendo devDeps para Vite) y compila
  command = "cd Backend && npm install --include=dev && npx prisma generate && npx prisma migrate deploy && mkdir -p netlify/functions/data && cp node_modules/pdfkit/js/data/*.afm netlify/functions/data/ && cd .. && cd Frontend && npm install --include=dev && npm run build"
  publish = "Frontend/dist"
  functions = "Backend/netlify/functions"

[build.environment]
  NODE_VERSION = "20"

# ─── Functions config ─────────────────────────────────────────────────────────
# esbuild bundlea correctamente entrypoints ESM (.mjs) como api.mjs
# included_files fuerza que los .afm copiados viajen con la function en deploy
[functions]
  node_bundler = "esbuild"

[functions."api"]
  included_files = ["Backend/netlify/functions/data/**"]

# ─── Redirects ───────────────────────────────────────────────────────────────

# 1) /api/* → Netlify Function (backend Express serverless)
[[redirects]]
  from   = "/api/*"
  to     = "/.netlify/functions/api/:splat"
  status = 200
  force  = true

# 2) SPA fallback — React Router maneja rutas del lado cliente
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200
